services:

  db:
    image: postgis/postgis:16-3.4
    restart: always
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    env_file: .env.prod
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn geoportal.wsgi:application
               --bind 0.0.0.0:8000
               --workers 3
               --timeout 60"
    volumes:
      - static_vol:/app/staticfiles
      - media_vol:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  geoserver:
    image: kartoza/geoserver:2.24.0
    restart: always
    environment:
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - GEOSERVER_DATA_DIR=/opt/geoserver_data
      - INITIAL_MEMORY=512M
      - MAXIMUM_MEMORY=1G
    volumes:
      - geoserver_data:/opt/geoserver_data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  pycsw:
    image: geopython/pycsw:2.6.1
    restart: always
    volumes:
      - ./docker/pycsw.cfg:/etc/pycsw/pycsw.cfg:ro
      - pycsw_data:/home/pycsw
    environment:
      - PYCSW_CONFIG=/etc/pycsw/pycsw.cfg
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8000/csw?SERVICE=CSW&REQUEST=GetCapabilities' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_vol:/staticfiles:ro
      - media_vol:/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - web
      - geoserver
      - pycsw

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

volumes:
  pgdata:
  static_vol:
  media_vol:
  certbot_www:
  certbot_certs:
  geoserver_data:
  pycsw_data:
