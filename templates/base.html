<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GeoPortal Turism{% endblock %}</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<body>

<nav class="navbar">
    <div class="navbar__brand" style="display:flex; align-items:center; gap:12px;">
        🗺️ GeoPortal Turism
        <button id="sidebar-toggle" title="Згорнути/розгорнути панель">☰</button>
        <button id="route-toggle-btn" title="Маршрут">🚗 Маршрут</button>
    </div>
    <div class="navbar__links">
        <a href="{% url 'maps:index' %}">Карта</a>
        {% if user.is_staff %}
            <a href="/admin/">⚙️ Адмін</a>
        {% endif %}
        {% if user.is_authenticated %}
            <span>👤 {{ user.username }}</span>
            <a href="{% url 'accounts:logout' %}">Выйти</a>
        {% else %}
            <a href="{% url 'accounts:login' %}">Войти</a>
        {% endif %}
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.getElementById('route-toggle-btn')?.addEventListener('click', function () {
    var panel = document.getElementById('route-nav-panel');
    if (panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
});
</script>
{% block extra_js %}{% endblock %}

</body>
</html>
