services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  geoserver:
    image: kartoza/geoserver:2.24.0
    ports:
      - "8080:8080"
    environment:
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - GEOSERVER_DATA_DIR=/opt/geoserver_data
      - INITIAL_MEMORY=512M
      - MAXIMUM_MEMORY=1G
    volumes:
      - geoserver_data:/opt/geoserver_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  pycsw:
    image: geopython/pycsw:2.6.1
    ports:
      - "8001:8000"
    volumes:
      - ./docker/pycsw.cfg:/etc/pycsw/pycsw.cfg:ro
      - pycsw_data:/home/pycsw
    environment:
      - PYCSW_CONFIG=/etc/pycsw/pycsw.cfg
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8080/csw?SERVICE=CSW&REQUEST=GetCapabilities' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  geoserver_data:
  pycsw_data: