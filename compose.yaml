services:
  db:
    image: postgis/postgis:17-3.4
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    environment:
      - POSTGRES_HOST=db
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_vol:/app/staticfiles
      - media_vol:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_vol:/staticfiles:ro
      - media_vol:/media:ro
    depends_on:
      - web

  geoserver:
    image: kartoza/geoserver:2.24.0
    ports:
      - "8080:8080"
    environment:
      - GEOSERVER_ADMIN_USER=admin
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - GEOSERVER_DATA_DIR=/opt/geoserver_data
      - INITIAL_MEMORY=512M
      - MAXIMUM_MEMORY=1G
    volumes:
      - geoserver_data:/opt/geoserver_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  pycsw:
    image: geopython/pycsw:2.6.1
    ports:
      - "8001:8000"
    volumes:
      - ./docker/pycsw.cfg:/etc/pycsw/pycsw.cfg:ro
      - pycsw_data:/home/pycsw
    environment:
      - PYCSW_CONFIG=/etc/pycsw/pycsw.cfg
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:8000/csw?SERVICE=CSW&REQUEST=GetCapabilities' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  geoserver_data:
  pycsw_data:
  static_vol:
  media_vol: