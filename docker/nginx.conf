# ─────────────────────────────────────────────
#  КРОК 1: HTTP-only (до отримання SSL-сертифіката)
#  Після отримання сертифіката — розкоментуй блок HTTPS нижче
#  і закоментуй цей блок.
# ─────────────────────────────────────────────
server {
    listen 80;
    server_name localhost your-domain.com www.your-domain.com;

    # Let's Encrypt challenge (потрібен для отримання сертифіката)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Статика
    location /static/ {
        alias /staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Медіа
    location /media/ {
        alias /media/;
        expires 7d;
    }

    # GeoServer (WMS/WFS/WMTS)
    location /geoserver/ {
        proxy_pass         http://geoserver:8080/geoserver/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 100M;
    }

    # PyCSW (CSW 2.0.2)
    location /csw {
        proxy_pass         http://pycsw:8000/csw;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Django
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }
}


